services:
  postgres:
    image: postgres:17-alpine
    container_name: ai-marketing-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_marketing_suite
    ports:
      # Host 5433 to avoid clashing with any local Postgres already on 5432.
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  # Local SMTP catcher with a web UI — no signup, captures every email.
  # SMTP on :1025, inbox UI on http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    container_name: ai-marketing-mailpit
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  pgdata:
